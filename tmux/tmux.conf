source-file ~/.config/tmux/keybinds.conf

# colors
set -g @fg "#d8d0c0"
set -g @coral "#e08060"
set -g @olive "#8a9868"
set -g @orange "#c09058"
set -g @grey "#2a2a2a"

# settings
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g status-left-length 80
set -g status-right-length 150
set -g status-justify left
set -g status-style default
set -g window-status-separator " "

# session
set -g status-left "#[fg=#{E:@olive},bold] #{?client_prefix, , } #S #[noreverse,nobold] "

# active window
set -g window-status-current-format "#[fg=#{E:@fg},bg=#{E:@grey}, bold] #{?#{==:#{pane_current_command},ssh},󰣀 ,}#I. #W #[nobold]"

# inactive window
set -g window-status-format "#[dim] #{?#{==:#{pane_current_command},ssh},󰣀 ,}#I. #W #[nodim]"

# directory
set -g status-right "#[fg=#{E:@orange},bold]  #{b:pane_current_path} #[default]"
